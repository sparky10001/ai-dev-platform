model_list:

  # ================================================================
  # ⚡ FAST — Local deterministic (always available, zero-cost)
  # ================================================================
  - model_name: fast
    weight: 1.0
    litellm_params:
      model: ollama/tinyllama
      api_base: http://ollama:11434
      timeout: 15
      stream: false

  # ================================================================
  # 🧠 BALANCED — Efficient reasoning tier
  # ================================================================

  # NVIDIA NIM — primary (fast + strong)
  - model_name: balanced
    weight: 0.6
    litellm_params:
      model: nvidia_nim/mistralai/mistral-nemotron
      api_key: os.environ/NVIDIA_NIM_API_KEY
      api_base: https://integrate.api.nvidia.com/v1
      timeout: 120
      stream: false

  # NVIDIA NIM — secondary (code-strong)
  - model_name: balanced
    weight: 0.3
    litellm_params:
      model: nvidia_nim/deepseek-ai/deepseek-v4-pro
      api_key: os.environ/NVIDIA_NIM_API_KEY
      timeout: 120
      stream: false

  # Local fallback (guaranteed execution)
  - model_name: balanced
    weight: 0.1
    litellm_params:
      model: ollama/tinyllama
      api_base: http://ollama:11434
      timeout: 25
      stream: false

  # ================================================================
  # 🧠💥 HEAVY — Best available reasoning tier
  # ================================================================

  # OpenAI — preferred
  - model_name: heavy
    weight: 0.5
    litellm_params:
      model: openai/gpt-4.1
      api_key: os.environ/OPENAI_API_KEY
      timeout: 45
      stream: false

  # Anthropic — strong fallback
  - model_name: heavy
    weight: 0.3
    litellm_params:
      model: anthropic/claude-sonnet-4-5
      api_key: os.environ/ANTHROPIC_API_KEY
      timeout: 45
      stream: false

  # NVIDIA — free + capable
  - model_name: heavy
    weight: 0.15
    litellm_params:
      model: nvidia_nim/deepseek-ai/deepseek-coder-6.7b-instruct
      api_key: os.environ/NVIDIA_NIM_API_KEY
      timeout: 45
      stream: false

  # Local — last resort
  - model_name: heavy
    weight: 0.05
    litellm_params:
      model: ollama/tinyllama
      api_base: http://ollama:11434
      timeout: 30
      stream: false


# ================================================================
# 🔁 ROUTER SETTINGS (v3)
# ================================================================
router_settings:

  # 🔥 Core upgrade: latency-aware routing
  routing_strategy: least-busy

  # Retry behavior
  num_retries: 2
  retry_after: 1

  # Global timeout cap
  timeout: 60

  # Cross-tier fallback chain (unchanged philosophy)
  fallbacks:
    - balanced: [fast]
    - heavy: [balanced, fast]

  # Cooldown failing providers (prevents thrashing)
  cooldown_time: 30

  # (Optional but powerful) mark slow providers
  slow_model_threshold: 10

  # Enable when debugging routing decisions
  set_verbose: false


# ================================================================
# ⚙️ GENERAL SETTINGS
# ================================================================
general_settings:

  allow_requests_without_key: true

  # Attach metadata for observability (passed through requests)
  request_metadata:
    system: devcontainer
    router_version: v3


# ================================================================
# 📊 LITELLM SETTINGS
# ================================================================
litellm_settings:

  drop_params: true

  # Turn ON temporarily for debugging
  set_verbose: false

  # Future-proofing: hooks for logging systems
  success_callback: []
  failure_callback: []